name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck (bash scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck on all scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./
          check_templates: false
          severity: warning

      - name: Validate systemd units syntax
        run: |
          set -e
          for f in systemd/*.service; do
            # Parse-check only (verify also checks ExecStart binaries, which
            # only exist after install on the target machine -> false positives here)
            systemd-analyze --man=no verify "$f" 2>&1 | grep -vE "is not executable|No such file or directory" | grep -q . && exit 1 || true
          done

      - name: Validate udev rules syntax
        run: |
          set -e
          for f in config/udev/*.rules; do
            udevadm verify "$f" || exit 1
          done

      - name: Validate install/uninstall references (no hardcoded user)
        run: |
          set -e
          for f in install/*.sh scripts/*.sh systemd/*.service config/udev/*.rules; do
            grep -E 'carlosh|jim|run/user/1000' "$f" && { echo "HARDCODED REF IN: $f"; exit 1; } || true
          done