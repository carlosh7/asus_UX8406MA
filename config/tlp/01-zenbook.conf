# TLP Configuration for ASUS Zenbook Duo UX8406MA

# CPU
# Ronda 10b (2026-10-30): AC subía TODO a "performance" y el CPU no
# reposaba — medido: carga 1.5 con mediana de frecuencia 3.3 GHz,
# paquete a 94-100°C con ventilador a 7100 RPM (queja del usuario:
# "siempre caliente con navegador y editor"). El gobernador powersave
# con intel_pstate+HWP (default de Ubuntu) mantiene la respuesta y
# deja los núcleos aparcar a 400 MHz. En batería no cambia.
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power

# WiFi
WiFi_PWR_ON_AC=off
WiFi_PWR_ON_BAT=on

# Bluetooth
BT_PWR_ON_AC=off
BT_PWR_ON_BAT=on

# USB
USB_AUTOSUSPEND=1
USB_EXCLUDE_BT=0
# NIC USB (ASIX AX88179/178A y similares): el autosuspend tumba la conexión
# (ronda 8b: adaptador con NO-CARRIER por autosuspend)
USB_DENYLIST="0b95:1790 0b95:178a"

# Disk
DISK_APM_LEVEL_ON_AC="254"
DISK_APM_LEVEL_ON_BAT="128"
DISK_SPINDOWN_TIMEOUT_ON_AC="0"
DISK_SPINDOWN_TIMEOUT_ON_BAT="12"

# Sound
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# Runtime PM
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto

# Platform profile
# Ronda 10b: perfil de plataforma lo gestiona ÚNICAMENTE el monitor térmico
# (zenbook-thermal: quiet<68 / balanced<82 / performance>=82). TLP lo clavaba
# a "performance" en AC y en cada evento de energía pisaba al monitor — dos
# escritores peleados (patrón M7/duplicados). En batería se deja a TLP.
#PLATFORM_PROFILE_ON_AC=performance
#PLATFORM_PROFILE_ON_BAT=low-power
